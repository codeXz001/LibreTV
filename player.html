<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="referrer" content="same-origin">
    <title>LibreTV 播放器</title>

    <!-- Favicon -->
    <link rel="icon" href="image/logo.png">
    <link rel="apple-touch-icon" href="image/logo-black.png">
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind 静态构建：defer 避免阻塞首屏解析 -->
    <link rel="stylesheet" href="css/tailwind-static.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/player.css">

    <!-- 播放器库预加载：打开播放页即并行下载 hls.js + ArtPlayer，
         不等 JS 动态创建 script，首帧显著提前（SW 缓存命中时秒开） -->
    <link rel="preload" as="script" href="libs/hls.min.js">
    <link rel="preload" as="script" href="libs/artplayer.min.js">

    <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body class="player-page">
    <!-- 密码验证弹窗 -->
    <div id="passwordModal" class="fixed inset-0 bg-black/95 hidden items-center justify-center z-[65] transition-opacity duration-300">
        <div class="bg-[#111] p-4 sm:p-8 rounded-lg w-11/12 max-w-md border border-[#333] max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-6 flex-none">
                <h2 class="text-2xl font-bold gradient-text">访问验证</h2>
            </div>
            <div class="mb-6">
                <p class="text-gray-300 mb-4">请输入密码继续访问</p>
                <form id="passwordForm" onsubmit="handlePasswordSubmit(); return false;">
                    <input type="text" name="username" id="username" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true">
                    <input type="password" id="passwordInput" class="w-full bg-[#111] border border-[#333] text-white px-4 py-3 rounded-lg focus:outline-none focus:border-white transition-colors" placeholder="密码..." autocomplete="new-password">
                    <button id="passwordSubmitBtn" type="submit" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">提交</button>
                </form>
                <p id="passwordError" class="text-red-500 mt-2 hidden">密码错误，请重试</p>
            </div>
        </div>
    </div>

    <!-- 播放器舞台：播放器 + 叠加返回按钮 -->
    <div class="player-stage">
        <div id="playerContainer" class="player-container">
            <div class="player-frame">
                <div id="player" class="player-placeholder">
                    <!-- Initial loading state before JavaScript loads -->
                    <div class="player-loading-overlay">
                        <div class="player-loading-spinner"></div>
                        <div class="player-loading-text" id="loading-title">正在加载视频...</div>
                    </div>
                </div>
                <div class="loading-container" id="player-loading" style="display: none;">
                    <div class="loading-spinner"></div>
                    <div>正在加载视频...</div>
                </div>
                <div class="error-container" id="error">
                    <div class="error-icon">⚠️</div>
                    <div id="error-message">视频加载失败</div>
                    <div class="error-message-sub">请尝试其他视频源或稍后重试</div>
                </div>
            </div>
        </div>

        <!-- 返回按钮：悬浮于播放器左上角（毛玻璃圆钮） -->
        <a href="#" id="goBack" onclick="goBack(event)" class="player-back-btn" aria-label="返回上一页">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </a>
    </div>

    <main class="player-main">
        <!-- 信息浮条：片名 + 集数徽标 + 当前源 -->
        <div class="player-meta">
            <h1 id="videoTitle" class="player-title">正在加载...</h1>
            <div class="player-meta-badges">
                <span id="episodeInfo" class="meta-badge meta-badge-amber">第 1 集</span>
                <span id="resourceName" class="meta-badge meta-badge-cyan">—</span>
            </div>
        </div>

        <!-- 操作条：自动连播 / 倒序 / 分享 / 全屏 -->
        <div class="player-actions">
            <label class="action-toggle">
                <span class="action-label">自动连播</span>
                <label class="switch">
                    <input type="checkbox" id="autoplayToggle">
                    <span class="slider"></span>
                </label>
            </label>
            <button onclick="toggleEpisodeOrder()" class="action-btn" id="orderBtn" aria-label="倒序排列">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9M3 12h5m0 0l-3-3m3 3l-3 3M13 16h8m-4-3l4 3-4 3"/>
                </svg>
                <span id="orderText">倒序</span>
            </button>
            <button title="分享" onclick="shareVideo()" class="action-btn" aria-label="分享">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684z"/>
                </svg>
                <span>分享</span>
            </button>
        </div>

        <!-- 可切换源：当前源信息 + 源选项列表（点击直接切换） -->
        <div id="resourceInfoBarContainer" class="player-source-bar">
            <!-- 由 player.js 动态渲染 -->
        </div>

        <!-- 分集选择 -->
        <section class="player-episodes">
            <div class="episodes-head">
                <h2 class="episodes-title">选集</h2>
                <span class="episodes-count" id="episodesCount"></span>
            </div>
            <div class="episode-grid" id="episodesGrid">
                <div class="episodes-list" id="episodesList">
                    <!-- 集数将在这里动态加载 -->
                    <div class="col-span-full text-center text-gray-400 py-8">加载中...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- 添加 loading 提示框 -->
    <div id="loading" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[10001]">
        <div class="bg-[#111] p-4 sm:p-8 rounded-lg border border-[#333] flex items-center space-x-4">
            <div class="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
            <p class="text-white text-lg">加载中...</p>
        </div>
    </div>

    <!-- 快捷键提示浮层 -->
    <div id="shortcutHint" class="shortcut-hint">
        <svg id="shortcutIcon" class="shortcut-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5-5 5M6 7l5 5-5 5"/>
        </svg>
        <span id="shortcutText">快进</span>
    </div>

    <!-- 引入纯 JS sha256（HTTP 下依然可用）；defer 不阻塞首屏解析，
         原始 js-sha256 的保存逻辑见 password.js 顶部。
         sha256-fallback.js 内联同一实现，独立于 libs/ 目录 ——
         即使 libs/sha256.min.js 因 SW 缓存破损加载失败，同步哈希依旧可用 -->
    <script src="libs/sha256.min.js" defer></script>
    <script src="js/sha256-fallback.js" defer></script>

    <!-- HLS.js 与 ArtPlayer 合计约 680KB，改为 player.js 播放时按需动态加载，
         避免阻塞播放页首屏（标题/集数/控制条先渲染） -->

    <script src="js/config.js" defer></script>
    <script src="js/proxy-auth.js" defer></script>
    <script src="js/customer_site.js" defer></script>
    <script src="js/password.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/search.js" defer></script>
    <script src="js/player.js" defer></script>

    <script>
        // 创建全局环境变量对象
        window.__ENV__ = window.__ENV__ || {};

        // 注入服务器端环境变量 (将由服务器端替换)
        // PASSWORD 变量将在这里由服务器端注入
        window.__ENV__.PASSWORD = "{{PASSWORD}}";
        // ADMIN_PASSWORD 变量将在这里由服务器端注入
        window.__ENV__.ADMIN_PASSWORD = "{{ADMIN_PASSWORD}}";
    </script>
</body>
</html>
