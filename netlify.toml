# netlify.toml

[build]
  publish = "." # 发布根目录静态文件
  functions = "netlify/functions" # 指定 Netlify 函数目录
  ignore = "git" # 忽略 git 提交触发自动构建，防止构建循环

# 配置 Edge Functions
[[edge_functions]]
  function = "inject-env"
  path = "/*"

# ===== 静态资源缓存策略（与本地 server.mjs 保持一致）=====
# JS/CSS/libs/图片：强缓存 1 天
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/libs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML 页面：不缓存，避免更新后用户拿到旧版页面
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# 配置重写规则，将 /proxy/* 的请求路由到 proxy 函数
# 这样前端的 PROXY_URL 仍然可以是 '/proxy/'
[[redirects]]
  from = "/proxy/*"
  to = "/.netlify/functions/proxy/:splat" # 将路径参数传递给函数
  status = 200 # 重要：这是代理，不是重定向

# 处理搜索路径格式 /s=*
[[redirects]]
  from = "/s=*"
  to = "/index.html"
  status = 200
